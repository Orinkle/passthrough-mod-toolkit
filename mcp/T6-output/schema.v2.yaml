schema_version: 1
vocabulary_schema:
  keys:
  - name: host_abbr
    required: true
  - name: magic
    required: true
  - name: version
    required: true
  - name: mapping_name
    required: true
  - name: units_per_block
    required: true
  - name: host_state
    required: true
  - name: mc_state
    required: true
  - name: host_flags
    required: true
  - name: mc_flags
    required: true
  - name: input_type
    required: true
  - name: hurt_flags
    required: true
  - name: mc_event_type
    required: true
  - name: ren_type
    required: true
container:
  includes:
  - <cstdint>
  regions_template: "inline constexpr std::uint32_t kMagic = 0x54444B54u;   // [GUESS]\
    \ 'TDBT' 自行拟定\ninline constexpr std::uint32_t kVersion = 1;           // [GUESS]\n\
    inline constexpr wchar_t       kMappingName[] = L\"Local\\\\Teardown_v1\";\ninline\
    \ constexpr std::uint64_t kOffHeader = 0x0;\ninline constexpr std::uint64_t kOff{host_state_off}\
    \ = 0x100;\ninline constexpr std::uint64_t kOffMcState = 0x200;\ninline constexpr\
    \ std::uint64_t kOffWaterGrid = 0x300;      // [GUESS] Teardown 有流体 -> 保留位\ninline\
    \ constexpr std::uint64_t kOffInputRing = 0x1000;\ninline constexpr std::uint64_t\
    \ kInputRingEntries = 4096;\ninline constexpr std::uint64_t kOffCollisionRing\
    \ = 0x20000;\ninline constexpr std::uint64_t kCollisionRingBytes = 16ull << 20;\n\
    inline constexpr std::uint64_t kOffEventRing = 0x1020000;\ninline constexpr std::uint64_t\
    \ kEventRingEntries = 4096;\ninline constexpr std::uint64_t kOffRenderRing = 0x1200000;\n\
    inline constexpr std::uint64_t kRenderRingBytes = 32ull << 20;\ninline constexpr\
    \ std::uint64_t kMappingBytes = kOffRenderRing + kRenderRingBytes;\n\nstruct Header\n\
    {\n  std::uint32_t magic;\n  std::uint32_t version;\n  std::uint32_t tdPid;\n\
    \  std::uint32_t mcPid;\n  std::uint64_t tdHeartbeatMs;\n  std::uint64_t mcHeartbeatMs;\n\
    };\nstatic_assert(sizeof(Header) == 0x20);\n"
  fixed:
    col_region: "inline constexpr std::uint32_t kColRegionMaxTris = 2048;\nstruct\
      \ ColTri\n{\n  float nx, ny, nz;\n  float d;\n  float x0, y0, z0;\n  float x1,\
      \ y1, z1;\n  float x2, y2, z2;\n};\nstatic_assert(sizeof(ColTri) == 0x28);\n\
      struct ColRegion\n{\n  std::uint32_t seq;\n  std::uint32_t triCount;\n  std::int32_t\
      \  originX, originZ;   // Teardown: voxel column\n  std::uint32_t epoch;\n \
      \ std::uint64_t triOffset;\n};\nstatic_assert(sizeof(ColRegion) == 0x20);\n"
    mc_event: "struct McEvent\n{\n  std::uint32_t type;      // -> mc_event_type vocab\n\
      \  std::uint32_t flags;     // -> hurt_flags vocab\n  std::uint64_t tick;\n\
      \  double x, y, z;\n};\nstatic_assert(sizeof(McEvent) == 0x20);\n"
  order:
  - Header
  - ColTri
  - ColRegion
  - McEvent
vocabularies:
  TD:
    host_abbr: Td
    host_prefix: td
    magic: 0x54444B54u
    version: 1
    mapping_name: Local\Teardown_v1
    units_per_block: 1.0
    host_state:
      size: '0x40'
      fields:
      - std::uint32_t seq
      - std::uint32_t flags
      - std::uint32_t bodyId
      - std::uint32_t epoch
      - double posX, posY, posZ
      - float yaw, pitch
      - std::uint32_t teleportSeq
      - std::uint32_t viewportW, viewportH
      - float gameHour
    mc_state:
      size: '0x200'
      fields:
      - std::uint32_t seq
      - std::uint32_t flags
      - double x, y, z
      - float yaw, pitch
      - float eyeHeight
      - std::uint32_t teleportAck
      - std::uint32_t guiScale
      - std::uint64_t frameCounter
      - float fovDeg
      - std::uint32_t onGround
      - std::uint32_t pad[110]
    host_flags:
    - name: kTdInGame
      value: 1u << 0
    - name: kTdMenuOpen
      value: 1u << 1
    - name: kTdLoading
      value: 1u << 2
    - name: kTdPaused
      value: 1u << 3
    mc_flags:
    - name: kMcInWorld
      value: 1u << 0
    - name: kMcScreenOpen
      value: 1u << 1
    - name: kMcOnGround
      value: 1u << 2
    - name: kMcSneaking
      value: 1u << 3
    - name: kMcSprinting
      value: 1u << 4
    - name: kMcDead
      value: 1u << 5
    input_type:
    - name: kInputKey
      value: '0'
    - name: kInputMouseBtn
      value: '1'
    - name: kInputMouseMove
      value: '2'
    - name: kInputScroll
      value: '3'
    hurt_flags:
    - name: kHurtNone
      value: '0'
    - name: kHurtEnv
      value: '1'
    - name: kHurtMob
      value: '2'
    - name: kHurtFall
      value: '3'
    mc_event_type:
    - name: kMcEvBlockBreak
      value: '0'
    - name: kMcEvBlockPlace
      value: '1'
    - name: kMcEvDig
      value: '2'
    - name: kMcEvInteract
      value: '3'
    ren_type:
    - name: kRenOverlay
      value: '0'
    - name: kRenTile
      value: '1'
