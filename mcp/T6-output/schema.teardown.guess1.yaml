# T6 实验:自写 schema —— 把 Teardown 注册为一个 passthrough 宿主
# 作者: T6 上手实验(第一次接触本工具包)
# 说明: 本文件是"最小必要动作"——工具没有提供 schema 模板/JSON-Schema 说明,
#       其结构系从工具自身产物(SKY.proto.h / layout_from_schema.py)反推。
#       凡标 [GUESS] 的字段都是我猜的, 需由人核对。
schema_version: 1

# [GUESS] 顶层 vocabulary_schema: 校验器只检查它"存在", 未给出其内容格式。
vocabulary_schema:
  required:
    - host_abbr
    - magic
    - version
    - mapping_name
    - units_per_block
    - host_state      # {fields:[...], size:"0x.."}
    - mc_state        # {fields:[...], size:"0x.."}
    - host_flags
    - mc_flags
    - input_type
    - hurt_flags
    - mc_event_type
    - ren_type
  optional:
    - host_prefix
    - col_tri_flags
    - dig_material
    - tool_kind

container:
  includes:
    - "<cstdint>"

  regions_template: |
    inline constexpr std::uint32_t kMagic = 0x54444B54u;   // [GUESS] 'TDBT' 自行拟定
    inline constexpr std::uint32_t kVersion = 1;           // [GUESS]
    inline constexpr wchar_t       kMappingName[] = L"Local\\Teardown_v1";
    inline constexpr std::uint64_t kOffHeader = 0x0;
    inline constexpr std::uint64_t kOff{host_state_off} = 0x100;
    inline constexpr std::uint64_t kOffMcState = 0x200;
    inline constexpr std::uint64_t kOffWaterGrid = 0x300;      // [GUESS] Teardown 有流体 -> 保留位
    inline constexpr std::uint64_t kOffInputRing = 0x1000;
    inline constexpr std::uint64_t kInputRingEntries = 4096;
    inline constexpr std::uint64_t kOffCollisionRing = 0x20000;
    inline constexpr std::uint64_t kCollisionRingBytes = 16ull << 20;
    inline constexpr std::uint64_t kOffEventRing = 0x1020000;
    inline constexpr std::uint64_t kEventRingEntries = 4096;
    inline constexpr std::uint64_t kOffRenderRing = 0x1200000;
    inline constexpr std::uint64_t kRenderRingBytes = 32ull << 20;
    inline constexpr std::uint64_t kMappingBytes = kOffRenderRing + kRenderRingBytes;

    struct Header
    {
      std::uint32_t magic;
      std::uint32_t version;
      std::uint32_t tdPid;
      std::uint32_t mcPid;
      std::uint64_t tdHeartbeatMs;
      std::uint64_t mcHeartbeatMs;
    };
    static_assert(sizeof(Header) == 0x20);

  fixed:
    # [GUESS] fixed 是一个 mapping(name -> C++ 文本), 我据 SKY.proto.h 的同类结构仿写。
    col_region: |
      inline constexpr std::uint32_t kColRegionMaxTris = 2048;
      struct ColTri
      {
        float nx, ny, nz;
        float d;
        float x0, y0, z0;
        float x1, y1, z1;
        float x2, y2, z2;
      };
      static_assert(sizeof(ColTri) == 0x28);
      struct ColRegion
      {
        std::uint32_t seq;
        std::uint32_t triCount;
        std::int32_t  originX, originZ;   // Teardown: voxel column
        std::uint32_t epoch;
        std::uint64_t triOffset;
      };
      static_assert(sizeof(ColRegion) == 0x20);
    mc_event: |
      struct McEvent
      {
        std::uint32_t type;      // -> mc_event_type vocab
        std::uint32_t flags;     // -> hurt_flags vocab
        std::uint64_t tick;
        double x, y, z;
      };
      static_assert(sizeof(McEvent) == 0x20);

  order:
    - Header
    - ColTri
    - ColRegion
    - McEvent

vocabularies:
  # 宿主: Teardown (单机 / 无反作弊 / Lua moddable / 体素 —— 与 Minecraft 同构)
  # 词表键 "TD" = Teardown 的 2 字缩写, 对齐 SKY/FO4/VAL 的命名习惯。
  TD:
    host_abbr: Td
    host_prefix: td
    magic: 0x54444B54u
    version: 1
    mapping_name: "Local\\Teardown_v1"
    units_per_block: 1.0        # [GUESS] Teardown 体素边长即 1 单位, 必须实测

    host_state:
      size: "0x40"
      fields:
        - "std::uint32_t seq"
        - "std::uint32_t flags"        # -> host_flags
        - "std::uint32_t bodyId"       # Teardown 的刚体/载具 id
        - "std::uint32_t epoch"        # 世界/存档重载代次
        - "double posX, posY, posZ"
        - "float yaw, pitch"
        - "std::uint32_t teleportSeq"
        - "std::uint32_t viewportW, viewportH"
        - "float gameHour"

    mc_state:
      size: "0x200"
      fields:
        - "std::uint32_t seq"
        - "std::uint32_t flags"        # -> mc_flags
        - "double x, y, z"
        - "float yaw, pitch"
        - "float eyeHeight"
        - "std::uint32_t teleportAck"
        - "std::uint32_t guiScale"
        - "std::uint64_t frameCounter"
        - "float fovDeg"
        - "std::uint32_t onGround"
        - "std::uint32_t pad[110]"

    host_flags:
      - {name: kTdInGame,    value: "1u << 0"}
      - {name: kTdMenuOpen,  value: "1u << 1"}
      - {name: kTdLoading,   value: "1u << 2"}
      - {name: kTdPaused,    value: "1u << 3"}    # [GUESS] 单机才有暂停语义
    mc_flags:
      - {name: kMcInWorld,   value: "1u << 0"}
      - {name: kMcScreenOpen, value: "1u << 1"}
      - {name: kMcOnGround,  value: "1u << 2"}
      - {name: kMcSneaking,  value: "1u << 3"}
      - {name: kMcSprinting, value: "1u << 4"}
      - {name: kMcDead,      value: "1u << 5"}
    input_type:
      - {name: kInputKey,    value: "0"}
      - {name: kInputMouseBtn, value: "1"}
      - {name: kInputMouseMove, value: "2"}
      - {name: kInputScroll, value: "3"}
    hurt_flags:
      - {name: kHurtNone,    value: "0"}
      - {name: kHurtEnv,     value: "1"}
      - {name: kHurtMob,     value: "2"}
      - {name: kHurtFall,    value: "3"}
    mc_event_type:
      - {name: kMcEvBlockBreak, value: "0"}
      - {name: kMcEvBlockPlace, value: "1"}
      - {name: kMcEvDig,     value: "2"}
      - {name: kMcEvInteract, value: "3"}
    ren_type:
      - {name: kRenOverlay,  value: "0"}
      - {name: kRenTile,     value: "1"}
