vocabulary_schema:
  namespace: C++ namespace, e.g. skycraft::proto
  host_abbr: 'Sky | Val  (drives host-state struct/enum names: SkyState/SkyFlags, ValState/ValFlags, and
    Header pid/heartbeat field names)'
  magic: hex literal, e.g. 0x43594B53
  version: integer
  mapping_name: wchar string, e.g. Local\SkyCraft_v1
  units_per_block: double literal, e.g. 70.0 or 1.0
  host_flags: enum members [{name, value}]  (value is the RHS expression, e.g. '1u << 0', or null for
    auto)
  host_state: '{ fields: [decl lines], size: ''0x40''|''0xC0''|''0x90'', ground_grid: null|int }'
  mc_flags: enum members [{name, value}]
  mc_state: '{ fields: [decl lines], size: ''0xC8''|''0x100'' }'
  input_type: enum members [{name, value}]  (underlying std::uint16_t)
  hurt_flags: enum members [{name, value}]
  mc_event_type: enum members [{name, value}]
  ren_type: enum members [{name, value}]
  col_tri_flags: '{ members: [{name, value}], has_shift: bool }'
  dig_material: null  OR  enum members [{name, value}]  (underlying std::uint8_t)
  ren_dug: bool  (whether struct RenDug is present)
  tool_kind: null  OR  enum members [{name, value}]
vocabularies:
  SKY:
    namespace: skycraft::proto
    host_abbr: Sky
    host_prefix: skyrim
    magic: '0x43594B53'
    version: 11
    mapping_name: Local\\SkyCraft_v1
    units_per_block: '70.0'
    host_flags:
    - name: kSkyInGame
      value: 1u << 0
    - name: kSkyMenuOpen
      value: 1u << 1
    - name: kSkyLoading
      value: 1u << 2
    host_state:
      fields:
      - std::uint32_t seq;
      - std::uint32_t flags;
      - std::uint32_t worldId;
      - std::uint32_t collisionEpoch;
      - double        posX, posY, posZ;
      - float         yaw, pitch;
      - std::uint32_t teleportSeq;
      - std::uint32_t viewportW, viewportH;
      - float         gameHour;
      size: '0x40'
      ground_grid: null
    mc_flags:
    - name: kMcInWorld
      value: 1u << 0
    - name: kMcScreenOpen
      value: 1u << 1
    - name: kMcOnGround
      value: 1u << 2
    - name: kMcSneaking
      value: 1u << 3
    - name: kMcSprinting
      value: 1u << 4
    - name: kMcDead
      value: 1u << 5
    - name: kMcSwimming
      value: 1u << 6
    - name: kMcFlying
      value: 1u << 7
    mc_state:
      fields:
      - std::uint32_t seq;
      - std::uint32_t flags;
      - double        x, y, z;
      - float         yaw, pitch;
      - float         eyeHeight;
      - float         sensitivity;
      - std::uint32_t teleportAck;
      - std::uint32_t guiScale;
      - std::uint64_t frameCounter;
      - float         fovDeg;
      - float         bobPhase;
      - float         bobAmount;
      - std::uint32_t pad4C;
      - double        eyeX, eyeY, eyeZ;
      - std::int64_t tickQpc;
      - double       prevX, prevY, prevZ;
      - double       curX, curY, curZ;
      - float        tickEyeO, tickEye;
      - float        walkDistO, walkDist;
      - float        bobO, bob;
      - float        tickMs;
      - std::uint32_t tickPad;
      - std::uint32_t cameraMode;
      - float         cameraDistance;
      size: '0xC8'
    input_type:
    - name: kInKey
      value: '1'
    - name: kInMouseButton
      value: '2'
    - name: kInScroll
      value: '3'
    - name: kInCursor
      value: '4'
    - name: kInText
      value: '5'
    - name: kInReleaseAll
      value: '6'
    - name: kInHurt
      value: '7'
    - name: kInOpenMenu
      value: '8'
    hurt_flags:
    - name: kHurtBlockedInSkyrim
      value: 1u << 0
    - name: kHurtPowerAttack
      value: 1u << 1
    mc_event_type:
    - name: kEvHitActor
      value: '1'
    - name: kEvPlayerDied
      value: '2'
    - name: kEvExplosion
      value: '3'
    - name: kEvArrowStuck
      value: '4'
    - name: kEvSkillUse
      value: '5'
    ren_type:
    - name: kRenPad
      value: '0'
    - name: kRenAtlas
      value: '1'
    - name: kRenSection
      value: '2'
    - name: kRenClearAll
      value: '3'
    - name: kRenTexture
      value: '4'
    - name: kRenAvatar
      value: '5'
    - name: kRenScene
      value: '6'
    - name: kRenAtlasRegion
      value: '7'
    - name: kRenLights
      value: '8'
    - name: kRenSolids
      value: '10'
    - name: kRenDug
      value: '11'
    - name: kRenRagdoll
      value: '9'
    col_tri_flags:
